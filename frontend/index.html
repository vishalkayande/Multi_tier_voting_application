<!DOCTYPE html>
<html>
<head>
    <title>Live Vote: BJP vs INC</title>
    <style>
        body { font-family: Arial; text-align: center; background: #f4f4f4; }
        .container { display: flex; justify-content: center; gap: 50px; margin-top: 50px; }
        .party-box { width: 150px; height: 300px; border: 4px solid #333; position: relative; background: #fff; border-radius: 10px; overflow: hidden; }
        .filler { position: absolute; bottom: 0; width: 100%; transition: height 0.5s ease; }
        .bjp-fill { background: #FF9933; } /* Saffron */
        .inc-fill { background: #138808; } /* Green */
        .label { font-weight: bold; margin-top: 10px; }
        button { margin-top: 15px; padding: 10px 20px; cursor: pointer; font-weight: bold; border-radius: 5px; border: none; }
        .btn-bjp { background: #FF9933; color: white; }
        .btn-inc { background: #138808; color: white; }
    </style>
</head>
<body>
    <h1>Live Election Voting</h1>
    <div class="container">
        <div>
            <div class="party-box"><div id="bjp-bar" class="filler bjp-fill" style="height: 0%;"></div></div>
            <div class="label">BJP: <span id="bjp-count">0</span></div>
            <button class="btn-bjp" onclick="castVote('BJP')">Vote BJP</button>
        </div>
        <div>
            <div class="party-box"><div id="inc-bar" class="filler inc-fill" style="height: 0%;"></div></div>
            <div class="label">INC: <span id="inc-count">0</span></div>
            <button class="btn-inc" onclick="castVote('INC')">Vote INC</button>
        </div>
    </div>

    <script>
        async function loadResults() {
            const res = await fetch("/api/results");
            const data = await res.json();
            const bjp = data.find(p => p.party === "BJP").count;
            const inc = data.find(p => p.party === "INC").count;
            const total = (bjp + inc) || 1; // Avoid division by zero

            document.getElementById("bjp-count").innerText = bjp;
            document.getElementById("inc-count").innerText = inc;
            document.getElementById("bjp-bar").style.height = (bjp / total * 100) + "%";
            document.getElementById("inc-bar").style.height = (inc / total * 100) + "%";
        }

        async function castVote(party) {
            await fetch("/api/vote", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ party })
            });
            loadResults();
        }
        setInterval(loadResults, 2000);
        loadResults();
    </script>
</body>
</html>
