<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Voting Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 40px 20px;
            color: #333;
        }

        .dashboard-container {
            max-width: 1200px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        header {
            text-align: center;
            margin-bottom: 50px;
            border-bottom: 3px solid #667eea;
            padding-bottom: 20px;
        }

        h1 {
            font-size: 3rem;
            color: #667eea;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .subtitle {
            font-size: 1.2rem;
            color: #666;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 50px;
        }

        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 25px;
            border-radius: 15px;
            color: white;
            text-align: center;
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.3);
        }

        .stat-card:nth-child(2) {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            box-shadow: 0 10px 25px rgba(17, 153, 142, 0.3);
        }

        .stat-card:nth-child(3) {
            background: linear-gradient(135deg, #eb3349 0%, #f45c43 100%);
            box-shadow: 0 10px 25px rgba(235, 51, 73, 0.3);
        }

        .stat-card:nth-child(4) {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            box-shadow: 0 10px 25px rgba(240, 147, 251, 0.3);
        }

        .stat-number {
            font-size: 2.5rem;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .stat-label {
            font-size: 0.9rem;
            opacity: 0.9;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .voting-section {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 40px;
            margin-bottom: 50px;
        }

        .vote-box {
            background: white;
            border: 3px solid #e0e0e0;
            border-radius: 20px;
            padding: 40px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .vote-box:hover {
            transform: translateY(-10px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
        }

        .vote-box.yes {
            border-color: #38ef7d;
        }

        .vote-box.no {
            border-color: #f45c43;
        }

        .vote-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .vote-option {
            font-size: 2.5rem;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .vote-box.yes .vote-option {
            color: #38ef7d;
        }

        .vote-box.no .vote-option {
            color: #f45c43;
        }

        .progress-bar-container {
            width: 100%;
            height: 200px;
            background: #f0f0f0;
            border-radius: 15px;
            position: relative;
            overflow: hidden;
            margin-bottom: 30px;
            display: flex;
            align-items: flex-end;
        }

        .progress-bar {
            width: 100%;
            border-radius: 15px 15px 0 0;
            transition: height 0.5s ease;
        }

        .vote-box.yes .progress-bar {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
        }

        .vote-box.no .progress-bar {
            background: linear-gradient(135deg, #eb3349 0%, #f45c43 100%);
        }

        .progress-percentage {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 3rem;
            font-weight: bold;
            color: #333;
            text-shadow: 0 2px 4px rgba(255,255,255,0.8);
        }

        .vote-count {
            font-size: 1.8rem;
            font-weight: bold;
            text-align: center;
            margin-bottom: 20px;
            color: #555;
        }

        .vote-btn {
            width: 100%;
            padding: 20px;
            font-size: 1.3rem;
            font-weight: bold;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .vote-box.yes .vote-btn {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: white;
        }

        .vote-box.no .vote-btn {
            background: linear-gradient(135deg, #eb3349 0%, #f45c43 100%);
            color: white;
        }

        .vote-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
        }

        .vote-btn:active {
            transform: scale(0.98);
        }

        .chart-section {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
        }

        .chart-section h2 {
            font-size: 1.5rem;
            color: #667eea;
            margin-bottom: 20px;
            text-align: center;
        }

        .chart-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 50px;
        }

        .pie-chart {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background: conic-gradient(#38ef7d var(--yes-percent, 0%), #f45c43 0);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .chart-legend {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .legend-color {
            width: 20px;
            height: 20px;
            border-radius: 4px;
        }

        .legend-color.yes {
            background: #38ef7d;
        }

        .legend-color.no {
            background: #f45c43;
        }

        .refresh-indicator {
            text-align: center;
            color: #888;
            font-size: 0.9rem;
            margin-top: 30px;
        }

        .refresh-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #38ef7d;
            border-radius: 50%;
            margin-right: 5px;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        @media (max-width: 900px) {
            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .voting-section {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 500px) {
            .stats-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="dashboard-container">
        <header>
            <h1>Live Voting Dashboard</h1>
            <p class="subtitle">Real-time voting results and statistics</p>
        </header>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-number" id="total-votes">0</div>
                <div class="stat-label">Total Votes</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="yes-count">0</div>
                <div class="stat-label">Yes Votes</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="no-count">0</div>
                <div class="stat-label">No Votes</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="yes-percent">0%</div>
                <div class="stat-label">Yes %</div>
            </div>
        </div>

        <div class="chart-section">
            <h2>Vote Distribution</h2>
            <div class="chart-container">
                <div class="pie-chart" id="pie-chart"></div>
                <div class="chart-legend">
                    <div class="legend-item">
                        <div class="legend-color yes"></div>
                        <span>Yes</span>
                    </div>
                    <div class="legend-item">
                        <div class="legend-color no"></div>
                        <span>No</span>
                    </div>
                </div>
            </div>
        </div>

        <div class="voting-section">
            <div class="vote-box yes">
                <div class="vote-header">
                    <div class="vote-option">YES</div>
                </div>
                <div class="progress-bar-container">
                    <div class="progress-bar" id="yes-bar" style="height: 0%;"></div>
                    <div class="progress-percentage" id="yes-percentage">0%</div>
                </div>
                <div class="vote-count">Votes: <span id="yes-votes">0</span></div>
                <button class="vote-btn" onclick="castVote('Yes')">Cast Yes Vote</button>
            </div>

            <div class="vote-box no">
                <div class="vote-header">
                    <div class="vote-option">NO</div>
                </div>
                <div class="progress-bar-container">
                    <div class="progress-bar" id="no-bar" style="height: 0%;"></div>
                    <div class="progress-percentage" id="no-percentage">0%</div>
                </div>
                <div class="vote-count">Votes: <span id="no-votes">0</span></div>
                <button class="vote-btn" onclick="castVote('No')">Cast No Vote</button>
            </div>
        </div>

        <div class="refresh-indicator">
            <span class="refresh-dot"></span>
            Auto-refreshing every 2 seconds
        </div>
    </div>

    <script>
        async function loadResults() {
            try {
                const res = await fetch("/api/results");
                const data = await res.json();
                
                const yes = data.find(p => p.option === "Yes")?.count || 0;
                const no = data.find(p => p.option === "No")?.count || 0;
                const total = (yes + no) || 1;

                const yesPercent = Math.round((yes / total) * 100);
                const noPercent = Math.round((no / total) * 100);

                // Update stats cards
                document.getElementById("total-votes").innerText = total;
                document.getElementById("yes-count").innerText = yes;
                document.getElementById("no-count").innerText = no;
                document.getElementById("yes-percent").innerText = yesPercent + "%";

                // Update voting boxes
                document.getElementById("yes-votes").innerText = yes;
                document.getElementById("no-votes").innerText = no;
                document.getElementById("yes-bar").style.height = yesPercent + "%";
                document.getElementById("no-bar").style.height = noPercent + "%";
                document.getElementById("yes-percentage").innerText = yesPercent + "%";
                document.getElementById("no-percentage").innerText = noPercent + "%";

                // Update pie chart
                document.getElementById("pie-chart").style.setProperty('--yes-percent', yesPercent + '%');
            } catch (err) {
                console.error("Error loading results:", err);
            }
        }

        async function castVote(option) {
            try {
                await fetch("/api/vote", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ option })
                });
                loadResults();
            } catch (err) {
                console.error("Error casting vote:", err);
            }
        }

        setInterval(loadResults, 2000);
        loadResults();
    </script>
</body>
</html>
